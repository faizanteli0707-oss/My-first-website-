<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f0f4f8;
            color: #333;
            text-align: center;
        }

        header {
            background: #1565c0;
            color: white;
            padding: 30px 10px;
        }

        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 12px;
        }

        section {
            padding: 35px 15px;
        }

        .button {
            background: #1565c0;
            color: white;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 16px;
        }

        footer {
            background: #222;
            color: white;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>My first website project</p>
    </header>

    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </nav>

    <section id="home">
        <h2>Home</h2>
        <p>Welcome! I am learning how to build websites.</p>
        <button class="button" onclick="showMessage()">
            Click Me
        </button>
        <p id="message"></p>
    </section>

    <section id="about">
        <h2>About Us</h2>
        <p>This is my first website, created using HTML, CSS and JavaScript.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Thank you for visiting my website!</p>
    </section>

    <footer>
        <p>My First Website | 2026</p>
    </footer>

    <script>
        function showMessage() {
            document.getElementById("message").innerText =
                "Thank you for visiting my website!";
        }
    </script>

</body>
  </html>
